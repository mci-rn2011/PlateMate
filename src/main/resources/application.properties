spring.application.name=PlateMate
spring.profiles.active=dev

server.port=${PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

vaadin.launch-browser=false

platemate.upload.root=uploads
platemate.upload.max-bytes=5242880
platemate.upload.allowed-content-types=image/jpeg,image/png,image/webp,image/svg+xml

# Optional. Leave blank for the compile-safe mock route/location fallback.
platemate.maps.mapbox-token=${MAPBOX_ACCESS_TOKEN:}
